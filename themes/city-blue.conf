# ── city-blue — generated by build.sh ──
# Forked from janoamaral/tokyo-night-tmux via citypop-tn. See ATTRIBUTION.md.
# Re-run build.sh if Nerd Font glyphs ever disappear.

# ── Base ──
set -g status on
set -g status-position top
set -g status 2
set -g status-interval 5
set -g status-justify left
set -g status-left-length  80
set -g status-right-length 150

set -g status-style              "fg=#cdd9e5,bg=#0a1929"
set -g status-left-style         "fg=#cdd9e5,bg=#0a1929"
set -g status-right-style        "fg=#cdd9e5,bg=#0a1929"
set -g window-status-style          "fg=#cdd9e5,bg=#0a1929"
set -g window-status-current-style  "fg=#cdd9e5,bg=#0a1929"
set -g window-status-activity-style "fg=#cdd9e5,bg=#0a1929,none"
set -g window-status-bell-style     "fg=#cdd9e5,bg=#0a1929,none"
set -g window-status-last-style     "fg=#cdd9e5,bg=#0a1929"
set -g mode-style                "fg=#80ed99,bg=#1e4d7a"
set -g message-style             "bg=#4cc9f0,fg=#1e4d7a"
set -g message-command-style     "fg=#4cc9f0,bg=#1e4d7a"
set -g popup-border-style        "fg=#4cc9f0"

# ── Pane borders ──
set -g pane-border-lines heavy
set -g pane-border-style "fg=#1e4d7a,bg=default"
set -g pane-active-border-style "fg=#56cfe1,bg=default,bold"
set -g pane-border-status top
set -g pane-border-format "#[fg=#1e4d7a,bg=default]─#[fg=#cdd9e5,bg=default] #{?pane_active,#[fg=#56cfe1]●,#[fg=#1e4d7a]○} #P #[fg=#4cc9f0]#{pane_current_command} #[fg=#cdd9e5,dim]#{=/24/...:pane_title}#[nodim] #[fg=#1e4d7a,bg=default,dim]󰍽 right-click for menu #[nodim,fg=#1e4d7a,bg=default]─"

# ── Window list ──
set -g window-status-separator ""
set -g window-status-current-format "#[fg=#cdd9e5,bg=#0a1929,nobold,noitalics,nounderscore,nodim]#[fg=#64dfdf,bg=#1e4d7a] #{?#{==:#{pane_current_command},ssh},󰣀 ,󰆍 }#[fg=#cdd9e5,bold,nodim]#($HOME/.tmux/scripts/citypop/custom-number.sh #I none)#W#[nobold]#{?window_zoomed_flag, #($HOME/.tmux/scripts/citypop/custom-number.sh #P dsquare),} "
set -g window-status-format "#[fg=#cdd9e5,bg=#0a1929,nobold,noitalics,nounderscore,nodim]#[fg=#cdd9e5] #{?#{==:#{pane_current_command},ssh},󰣀 ,󰆍 }#[fg=#cdd9e5,bg=#0a1929,nobold,noitalics,nounderscore,nodim]#($HOME/.tmux/scripts/citypop/custom-number.sh #I none)#W#[nobold,dim]#{?window_zoomed_flag, #($HOME/.tmux/scripts/citypop/custom-number.sh #P dsquare),} "

# ── Status left/right (row 0) ──
set -g status-left "#[range=user|sess_menu,fg=#4cc9f0,bg=#1e4d7a,bold] 󰍜 #[norange,default]#[fg=#1e4d7a,bg=#4cc9f0,bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold,nodim]#(whoami)#($HOME/.tmux/scripts/citypop/hostname-widget.sh):#S #[default]"
set -g status-right "#($HOME/.tmux/scripts/citypop/git-status.sh \"#{pane_current_path}\")#[fg=#4cc9f0,bg=#1e4d7a,bold] 󰍛 #[fg=#cdd9e5,bg=#1e4d7a,nobold]#($HOME/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[fg=#4cc9f0,bg=#1e4d7a,bold] 󰘚 #[fg=#cdd9e5,bg=#1e4d7a,nobold]#($HOME/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) #[fg=#4cc9f0,bg=#1e4d7a,bold] 󰋊 #[fg=#cdd9e5,bg=#1e4d7a,nobold]#($HOME/.tmux/scripts/citypop/disk-widget.sh) #[fg=#4cc9f0,bg=#1e4d7a,bold] #($HOME/.tmux/scripts/citypop/weather-icon.sh) #[fg=#cdd9e5,bg=#1e4d7a,nobold]#($HOME/.tmux/scripts/citypop/weather-text.sh) #($HOME/.tmux/plugins/tmux-weather/scripts/weather.sh >/dev/null 2>&1)#($HOME/.tmux/scripts/citypop/battery-widget.sh)#($HOME/.tmux/scripts/citypop/netspeed.sh)"

# ── Status row 1 (info) ──
set -g status-format[1] "#[bg=#0a1929,fg=#cdd9e5]#[range=user|snapshots,fg=#4cc9f0,bg=#1e4d7a,bold] 󰖲 #[norange,default]#[bg=#0a1929,fg=#cdd9e5]#($HOME/.tmux/scripts/citypop/path-widget.sh \"#{pane_current_path}\")#[align=right,bg=#0a1929]#[range=user|focus_reset]#[fg=#4cc9f0,bg=#1e4d7a,bold] 󱎫 #[fg=#cdd9e5,bg=#1e4d7a,nobold]#($HOME/.tmux/scripts/citypop/focus-up.sh) #[norange]#($HOME/.tmux/scripts/citypop/datetime-widget.sh)"
