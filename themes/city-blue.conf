# ── city-blue — generated by build-city-blue.sh ──
# Re-run the script if Nerd Font glyphs ever disappear.

# ── Base ──
set -g status on
set -g status-position top
set -g status 2
set -g status-interval 5
set -g status-justify left

set -g status-style          "bg=#1a0b2e,fg=#f4e8d8"
set -g status-left-style     "bg=#1a0b2e,fg=#f4e8d8"
set -g status-right-style    "bg=#1a0b2e,fg=#f4e8d8"
set -g status-left-length    250
set -g status-right-length   250

set -g message-style          "bg=#ff2e88,fg=#1a0b2e,bold"
set -g message-command-style  "bg=#4ddbff,fg=#1a0b2e,bold"
set -g mode-style             "bg=#b366ff,fg=#1a0b2e,bold"

set -g pane-border-style        "fg=#4a2c6d"
set -g pane-active-border-style "fg=#ff2e88"
set -g display-panes-colour        "#4a2c6d"
set -g display-panes-active-colour "#ff2e88"

setw -g clock-mode-colour "#4ddbff"
setw -g clock-mode-style 24

# ── Window list (row 0) ──
setw -g window-status-separator " "
setw -g window-status-style          "bg=#1a0b2e,fg=#c9b8e0"
setw -g window-status-current-style  "bg=#1a0b2e,fg=#1a0b2e,bold"
setw -g window-status-activity-style "bg=#ffd23f,fg=#1a0b2e"
setw -g window-status-bell-style     "bg=#ff4d6d,fg=#1a0b2e,bold"

setw -g window-status-format         "#[fg=#4a2c6d,bg=#1a0b2e]#[bg=#4a2c6d,fg=#c9b8e0] #I  #W #[fg=#4a2c6d,bg=#1a0b2e]"
setw -g window-status-current-format "#[fg=#ff2e88,bg=#1a0b2e]#[bg=#ff2e88,fg=#1a0b2e,bold] #I  #W #[fg=#ff2e88,bg=#1a0b2e]"

# ── Row 0: mode + session, then window list (default tmux composition), right widgets ──
set -g status-left "#{?client_prefix,#[fg=#ffd23f#,bg=#1a0b2e]#[bg=#ffd23f#,fg=#1a0b2e#,bold] PREFIX #[fg=#ffd23f#,bg=#1a0b2e],#{?pane_in_mode,#[fg=#4ddbff#,bg=#1a0b2e]#[bg=#4ddbff#,fg=#1a0b2e#,bold] COPY #[fg=#4ddbff#,bg=#1a0b2e],#[fg=#6bffb0#,bg=#1a0b2e]#[bg=#6bffb0#,fg=#1a0b2e#,bold] NORMAL #[fg=#6bffb0#,bg=#1a0b2e]}} #[fg=#b366ff,bg=#1a0b2e]#[bg=#b366ff,fg=#1a0b2e,bold]  #S #[fg=#b366ff,bg=#1a0b2e] "

set -g status-right "#[fg=#ff7f3f,bg=#1a0b2e]#[bg=#ff7f3f,fg=#1a0b2e,bold] #{weather} #[fg=#ff7f3f,bg=#1a0b2e] #[fg=#ffd23f,bg=#1a0b2e]#[bg=#ffd23f,fg=#1a0b2e,bold] #{battery_icon} #{battery_percentage} #[fg=#ffd23f,bg=#1a0b2e] #[fg=#6bffb0,bg=#1a0b2e]#[bg=#6bffb0,fg=#1a0b2e,bold]  ONLINE #[fg=#6bffb0,bg=#1a0b2e]"

# ── Row 1: info row ──
# Plugin format placeholders (#{cpu_*}, #{battery_*}) only get post-processed
# in status-left/right by tpm plugins. For row 1 we call scripts directly.
set -g status-format[1] '#[bg=#1a0b2e,fg=#c9b8e0]#[align=left] #[fg=#4ddbff,bg=#1a0b2e]#[bg=#4ddbff,fg=#1a0b2e,bold]  #(whoami) #[fg=#4ddbff,bg=#1a0b2e] #[fg=#b366ff,bg=#1a0b2e]#[bg=#b366ff,fg=#1a0b2e,bold] #h #[fg=#b366ff,bg=#1a0b2e] #[fg=#6bffb0,bg=#1a0b2e]#[bg=#6bffb0,fg=#1a0b2e,bold]  #{b:pane_current_path} #[fg=#6bffb0,bg=#1a0b2e] #(/Users/b2nkuu/.tmux/scripts/git.sh #{pane_current_path})#[align=right]#[fg=#ff4d6d,bg=#1a0b2e]#[bg=#ff4d6d,fg=#1a0b2e,bold]  #(/Users/b2nkuu/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[fg=#ff4d6d,bg=#1a0b2e] #[fg=#4ddbff,bg=#1a0b2e]#[bg=#4ddbff,fg=#1a0b2e,bold]  %H:%M:%S #[fg=#4ddbff,bg=#1a0b2e] #[fg=#ffd23f,bg=#1a0b2e]#[bg=#ffd23f,fg=#1a0b2e,bold] %a %d %b #[fg=#ffd23f,bg=#1a0b2e] '

# ── Plugin icon overrides ──
# tmux-battery — city-blue tier glyphs
set -g @batt_icon_charge_tier8 ""
set -g @batt_icon_charge_tier7 ""
set -g @batt_icon_charge_tier6 ""
set -g @batt_icon_charge_tier5 ""
set -g @batt_icon_charge_tier4 ""
set -g @batt_icon_charge_tier3 ""
set -g @batt_icon_charge_tier2 ""
set -g @batt_icon_charge_tier1 ""
set -g @batt_icon_status_charging    "⚡"
set -g @batt_icon_status_charged     "✓"
set -g @batt_icon_status_discharging ""

# tmux-online-status — show OFFLINE in red when down
set -g @online_icon  " ONLINE"
set -g @offline_icon " OFFLINE"

# Pomodoro
set -g @pomodoro_on        "🍅 "
set -g @pomodoro_complete  "✓ "
set -g @pomodoro_pause     "⏸ "
set -g @pomodoro_prompt_break    "🍅 break? "
set -g @pomodoro_prompt_pomodoro " start? "
