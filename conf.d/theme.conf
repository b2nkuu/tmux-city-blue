# ─── city-blue theme options ──────────────────────────────────
# Forked from janoamaral/tokyo-night-tmux via citypop-tn. See ATTRIBUTION.md.
# Widget scripts read these via `tmux show-option -gv @city-blue_*`.

set -g @city-blue_transparent 0
set -g @city-blue_window_id_style none
set -g @city-blue_pane_id_style hsquare
set -g @city-blue_zoom_id_style dsquare

# Widgets
set -g @city-blue_show_git 1
set -g @city-blue_show_netspeed 1
set -g @city-blue_netspeed_iface "en0"
set -g @city-blue_show_battery_widget 1
set -g @city-blue_battery_name "InternalBattery-0"
set -g @city-blue_battery_low_threshold 21
set -g @city-blue_show_path 1
set -g @city-blue_path_format relative
set -g @city-blue_show_hostname 1
set -g @city-blue_show_datetime 1
set -g @city-blue_date_format DMY
set -g @city-blue_time_format 24H
