# ─── Plugin list (tpm) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ─── cpu / ram ────────────────────────────────────────────────
set -g @cpu_percentage_format "%.0f%%"
set -g @ram_percentage_format "%.0f%%"

# ─── weather ──────────────────────────────────────────────────
set -g @tmux-weather-interval 15

# ─── resurrect / continuum ────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh mosh-client claude nvim vim "~rails server" "~rails console"'
set -g @resurrect-dir '${RESURRECT_DIR:-$HOME/.local/share/tmux/resurrect}'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ─── extrakto (prefix+Tab fuzzy scrollback grab) ──────────────
set -g @extrakto_key 'Tab'
set -g @extrakto_clip_tool 'pbcopy'
set -g @extrakto_popup_size '80%,60%'
set -g @extrakto_fzf_unset_default_opts 'true'

# ─── sessionx (prefix+o fzf session switcher) ─────────────────
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '75%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-preview-location 'right'

# ─── floax (prefix+p floating scratch pane) ───────────────────
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#4cc9f0'
set -g @floax-text-color '#e0fbfc'
set -g @floax-change-path 'true'
set -g @floax-session-name 'scratch'

# ─── tmux-fzf (prefix+F fuzzy menu) ───────────────────────────
TMUX_FZF_LAUNCH_KEY="F"
TMUX_FZF_OPTIONS="-p -w 70% -h 70% -m"

# ─── tmux-online ──────────────────────────────────────────────
set -g @route_to_ping 'one.one.one.one'

# ─── tmux-open ────────────────────────────────────────────────
set -g @open-S 'https://www.google.com/search?q='
