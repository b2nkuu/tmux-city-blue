# ─── Reload ───────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "  reloaded"

# ─── Splits & pane navigation ─────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r m resize-pane -Z
bind -r , swap-window -t -1\; select-window -t -1
bind -r . swap-window -t +1\; select-window -t +1
bind Tab last-window

# ─── Copy mode (vi) bindings ──────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# ─── Popups: scratch shell, lazygit ───────────────────────────
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "lazygit 2>/dev/null || git status; zsh"
bind / display-popup -E -w 70% -h 70% -d "#{pane_current_path}"

# ─── Disable right-click context menu inside panes ───────────
# Keep right-click usable for selection / passthrough; only the
# status bar uses MouseDown3 for menus.
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane

# ─── Mouse on status bar ──────────────────────────────────────
# Left-click:
#   range=sess_menu   → session menu
#   range=focus_reset → timer reset menu
#   window pill       → switch to that window
# Middle-click on window pill → window management menu (rename/zoom/swap/move/new/kill)
# tmux on this host returns an empty #{mouse_window}, so "click selected window
# → menu" can't be detected; middle-click is a safer trigger than overloading
# the left button.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},sess_menu}' { display-menu -T "#[align=centre] #S " -x M -y S "󰆓  save session" s "run-shell '~/.tmux/scripts/session_save.sh'" "󰦛  restore session" r "run-shell '~/.tmux/scripts/session_restore.sh'" "" "󰑕  rename session" n "command-prompt -I '#S' { run-shell '~/.tmux/scripts/session_rename.sh \"%%\"' }" "󰈯  new session" N "command-prompt { new-session -s '%%' }" "󱂬  switch session" o "run-shell '~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh'" "󰆴  delete session" d "run-shell '~/.tmux/scripts/session_delete.sh'" "" "󰓦  sync plugins" S "run-shell '~/.tmux/scripts/plugin_sync.sh'" "" "󰜉  reload config" R "source-file ~/.tmux.conf ; display-message 'reloaded'" "" "󰗼  kill session" x "confirm-before -p 'kill session #S? (y/n)' kill-session" } { if -F '#{==:#{mouse_status_range},focus_reset}' { display-menu -T "#[align=centre]  focus " -x M -y S "󰜉  reset to 00:00" r "run-shell '~/.tmux/scripts/citypop/focus-reset.sh'" } { if -F '#{==:#{mouse_status_range},snapshots}' { display-menu -T "#[align=centre] 󰖲  snapshots " -x M -y S "󰕒  save as…" s "command-prompt -p 'snapshot name:' { run-shell '~/.tmux/scripts/snapshot_save.sh \"%%\"' }" "󰇚  load" l "run-shell '~/.tmux/scripts/snapshot_load.sh'" "󰆴  delete" d "run-shell '~/.tmux/scripts/snapshot_delete.sh'" } { select-window -t = } } }
bind -n MouseDown2Status if -F '#{==:#{mouse_status_range},window}' { display-menu -T "#[align=centre] #W " -t = -x M -y S "  rename" n "command-prompt -I '#W' { rename-window '%%' }" "  zoom" z "resize-pane -Z -t=" "" "  swap left" L "swap-window -t :-1 ; select-window -t :-1" "  swap right" R "swap-window -t :+1 ; select-window -t :+1" "  move to session" m "command-prompt -p 'session:' { move-window -t \"%%\" }" "  new window after" w "new-window -a -c '#{pane_current_path}'" "" "  kill" x "confirm-before -p 'kill #W? (y/n)' kill-window" }
# Drop every right-click context menu — pane, status, and alt+right
# variants. Right-click is left to terminal-side selection / passthrough.
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft
unbind -n M-MouseDown3Status
unbind -n M-MouseDown3StatusLeft
bind -n WheelDownStatus next-window
bind -n WheelUpStatus previous-window

# ─── which-key style menu (prefix+Space) ──────────────────────
bind Space display-menu -T "#[align=centre]  tmux  " -x C -y C \
  "  new window"         w "new-window -c '#{pane_current_path}'" \
  "  vsplit"             "|" "split-window -h -c '#{pane_current_path}'" \
  "  hsplit"             "-" "split-window -v -c '#{pane_current_path}'" \
  "" \
  "  zoom pane"          z "resize-pane -Z" \
  "  break pane → window" b "break-pane" \
  "  join pane"          J "choose-window 'join-pane -s \"%%\"'" \
  "" \
  "  rename window"      n "command-prompt -I '#W' { rename-window '%%' }" \
  "  rename session"     N "command-prompt -I '#S' { rename-session '%%' }" \
  "" \
  "  session picker"     s "run-shell 'tmux popup -E -w 60% -h 60% \"tmux ls -F \\\"#S\\\" | fzf --reverse | xargs -r tmux switch-client -t\"'" \
  "  kill window"        x "kill-window" \
  "  detach"             d "detach-client"
