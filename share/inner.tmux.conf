# city-blue inner tmux — runs inside a single outer pane to give that pane
# its own tabs (windows). Use a separate socket (`-L inner`) so it does not
# collide with the outer city-blue session.

# Prefix: C-a (outer keeps C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -sg escape-time 0

# ── city-blue palette (mirrors build.sh) ──
# BG=#0a1929 FG=#cdd9e5 BBLACK=#1e4d7a BLUE=#4cc9f0 CYAN=#56cfe1 GREEN=#64dfdf

# Status bar = tab strip at top of pane
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0a1929,fg=#cdd9e5"
set -g status-left "#[fg=#64dfdf,bg=#1e4d7a,bold] 󰓩 #[fg=#1e4d7a,bg=#0a1929,nobold] "
set -g status-right "#[range=user|new_tab,fg=#4cc9f0,bg=#1e4d7a,bold] + #[norange]#[fg=#1e4d7a,bg=#0a1929] #[range=user|close_tab,fg=#ff6b6b,bg=#1e4d7a,bold] - #[norange,fg=#1e4d7a,bg=#0a1929,nobold] "
set -g window-status-separator ""
set -g window-status-format         "#[fg=#cdd9e5,bg=#0a1929] #[fg=#cdd9e5]󰆍 #I  #W "
set -g window-status-current-format "#[fg=#cdd9e5,bg=#1e4d7a] #[fg=#64dfdf]󰆍 #[fg=#cdd9e5,bold]#I  #W #[nobold] "

# Pane borders match outer
set -g pane-border-lines heavy
set -g pane-border-style "fg=#1e4d7a,bg=default"
set -g pane-active-border-style "fg=#56cfe1,bg=default,bold"

# Message + mode style
set -g message-style "bg=#4cc9f0,fg=#0a1929,bold"
set -g mode-style    "bg=#56cfe1,fg=#0a1929,bold"

# Mouse: click "+" pill = new window; "x" pill = close current; click tab = switch
bind -n MouseDown1Status {
  if -F '#{==:#{mouse_status_range},new_tab}' { new-window } {
    if -F '#{==:#{mouse_status_range},close_tab}' { kill-window } {
      select-window -t =
    }
  }
}
# Scroll on status = cycle tabs
bind -n WheelDownStatus next-window
bind -n WheelUpStatus previous-window

# Alt-key tab navigation (no prefix needed)
bind -n M-t new-window
bind -n M-w kill-window
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-H swap-window -t -1 \; select-window -t -1
bind -n M-L swap-window -t +1 \; select-window -t +1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Rename window quickly
bind , command-prompt -I "#W" "rename-window '%%'"
