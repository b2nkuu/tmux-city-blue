# Example Ghostty config recommended by city-blue.
# Copy to ~/.config/ghostty/config or merge into your existing config.

font-family = "JetBrainsMono Nerd Font"
font-family = "Sarabun"
font-size = 14
font-feature = +liga
font-feature = +calt

# Required for tmux Alt/Meta bindings (e.g. inner tabs M-h/M-l).
macos-option-as-alt = true
