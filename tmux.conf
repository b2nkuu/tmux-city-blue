# ─────────────────────────────────────────────────────────────
# tmux entrypoint — modular config under ~/.tmux/conf.d/
#   general.conf   terminal, behavior, status shell
#   keybinds.conf  prefix maps, mouse, menus, copy-mode
#   plugins.conf   tpm plugin list + per-plugin options
# Theme is sourced AFTER tpm so the city-blue palette wins.
# ─────────────────────────────────────────────────────────────

source-file ~/.tmux/conf.d/general.conf
source-file ~/.tmux/conf.d/keybinds.conf
source-file ~/.tmux/conf.d/theme.conf
source-file ~/.tmux/conf.d/plugins.conf

run '~/.tmux/plugins/tpm/tpm'

# city-blue — generated by build.sh from citypop palette + widgets.
source-file ~/.tmux/themes/city-blue.conf
